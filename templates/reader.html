<!doctype html><html lang="{{lang}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#edf5f5"><title>{{title}} · The Arctic Comics Journal</title><meta name="description" content="{{description}}"><meta property="og:url" content="{{canonical}}"><meta property="og:type" content="website"><meta name="twitter:card" content="summary_large_image"><meta property="og:title" content="{{title}}"><meta property="og:description" content="{{description}}"><meta property="og:image" content="https://arcticcomics.org/assets/{{og_image}}?v=tungumal1"><link rel="alternate" hreflang="is" href="https://arcticcomics.org/"><link rel="alternate" hreflang="en" href="https://arcticcomics.org/en/"><link rel="alternate" hreflang="x-default" href="https://arcticcomics.org/"><link rel="canonical" href="{{canonical}}"><link rel="icon" href="/favicon.ico?v=tungumal1"><link rel="preload" href="/ARCTIC/letur/lif-latina.ttf" as="font" type="font/ttf" crossorigin><link rel="stylesheet" href="/ARCTIC/lesari.css?v=tungumal1"><script src="/ARCTIC/lesari.js?v=tungumal1" defer></script><link rel="stylesheet" href="/assets/husstill.css?v=tungumal1"></head><body>

<div id="library"><header class="library-header home-header"><nav class="site-nav" aria-label="{{navigation}}"><a class="project-link nav-icon drawn-control" href="{{handbook_url}}" tabindex="0" aria-label="{{handbook}}" title="{{handbook}}"><svg class="button-frame" viewBox="0 0 120 64" preserveAspectRatio="none" aria-hidden="true"><use href="#i-control"/></svg><svg aria-hidden="true"><use href="#i-pages"/></svg></a><a class="language-link nav-icon drawn-control" href="{{language_url}}" lang="{{other_lang}}" hreflang="{{other_lang}}" tabindex="0" aria-label="{{language}}" title="{{language}}"><svg class="button-frame" viewBox="0 0 120 64" preserveAspectRatio="none" aria-hidden="true"><use href="#i-control"/></svg><svg aria-hidden="true"><use href="#i-language"/></svg></a></nav></header><main class="library-main"><section class="introduction"><h1 id="library-title" tabindex="-1">{{heading_top}}<br><span>{{heading_bottom}}</span></h1></section>
<p id="library-status" class="notice" role="status" hidden></p><section class="story-grid" aria-label="{{stories}}">
{{story_cards}}
</section><footer class="library-footer"><p>{{credit}}</p><div class="footer-links"><a href="{{handbook_url}}">{{about}}</a><a href="{{handbook_url}}#contact">{{contact}}</a></div></footer></main></div>
<main id="reader" class="reader" hidden><h1 id="reader-author" class="sr-only" tabindex="-1"></h1>
<div class="reading-progress sr-only" id="reading-progress" role="progressbar" aria-label="{{progress}}" aria-valuemin="1" aria-valuemax="8" aria-valuenow="1"><span></span></div>
<section class="reading-space" aria-label="{{comic}}"><p id="reader-status" class="reader-status sr-only" aria-live="polite"></p><button id="page-art" class="page-art" type="button" aria-label="{{toggle_controls}}" aria-controls="reader-controls" aria-expanded="true" disabled><img id="page-image" alt="" draggable="false" hidden></button><div class="page-error" id="page-error" hidden><h2>{{image_error}}</h2><p>{{retry_copy}}</p><button id="retry-page" class="paper-button drawn-control" type="button"><svg class="button-frame" viewBox="0 0 120 64" preserveAspectRatio="none" aria-hidden="true"><use href="#i-control"/></svg>{{retry}}</button></div></section>
<section id="story-end" class="story-end" aria-label="{{end}}" hidden><h2>{{more_stories}}</h2><a id="next-story" class="next-story" href="{{home}}"><img id="next-cover" alt="" width="64" height="88"><span><small>{{another_story}}</small><strong id="next-author"></strong></span><svg aria-hidden="true"><use href="#i-right"/></svg></a><a class="all-link" href="{{home}}" data-library-link>{{choose_story}}</a></section>
<nav id="reader-controls" class="reader-bar" aria-label="{{controls}}"><a tabindex="0" href="{{home}}" id="all-stories" class="back-link drawn-control" aria-label="{{all_stories}}"><svg class="button-frame" viewBox="0 0 120 64" preserveAspectRatio="none" aria-hidden="true"><use href="#i-control"/></svg><svg aria-hidden="true"><use href="#i-library"/></svg><span>{{all_stories}}</span></a><button tabindex="0" id="previous-page" class="turn-button drawn-control" type="button" aria-label="{{previous_page}}"><svg class="button-frame" viewBox="0 0 120 64" preserveAspectRatio="none" aria-hidden="true"><use href="#i-control"/></svg><svg aria-hidden="true"><use href="#i-left"/></svg><span>{{previous}}</span></button><button tabindex="0" id="page-counter" class="page-counter drawn-control" type="button" aria-label="{{overview}}"><svg class="button-frame" viewBox="0 0 120 64" preserveAspectRatio="none" aria-hidden="true"><use href="#i-control"/></svg><svg class="overview-icon" aria-hidden="true"><use href="#i-pages"/></svg><span id="reader-trail" class="story-trail" aria-hidden="true"></span></button><button tabindex="0" id="next-page" class="turn-button next drawn-control" type="button" aria-label="{{next_page}}"><svg class="button-frame" viewBox="0 0 120 64" preserveAspectRatio="none" aria-hidden="true"><use href="#i-control"/></svg><span>{{next}}</span><svg aria-hidden="true"><use href="#i-right"/></svg></button><button tabindex="0" id="zoom-page" class="zoom-button drawn-control" type="button" aria-label="{{zoom_page}}"><svg class="button-frame" viewBox="0 0 120 64" preserveAspectRatio="none" aria-hidden="true"><use href="#i-control"/></svg><svg aria-hidden="true"><use href="#i-zoom"/></svg><span>{{zoom}}</span></button><button tabindex="0" id="share-story" class="tool-button drawn-control" type="button" aria-label="{{share_label}}"><svg class="button-frame" viewBox="0 0 120 64" preserveAspectRatio="none" aria-hidden="true"><use href="#i-control"/></svg><svg aria-hidden="true"><use href="#i-link"/></svg><span>{{share}}</span></button></nav><span class="action-status" id="action-status" role="status"></span></main>
<dialog id="pages-dialog" class="pages-dialog" aria-labelledby="pages-title"><header class="dialog-header"><div><p class="eyebrow">{{choose_page}}</p><h2 id="pages-title"></h2></div><button class="icon-button drawn-control" type="button" data-close="pages-dialog" aria-label="{{close_overview}}"><svg class="button-frame" viewBox="0 0 120 64" preserveAspectRatio="none" aria-hidden="true"><use href="#i-control"/></svg><svg aria-hidden="true"><use href="#i-close"/></svg></button></header><div id="page-thumbnails" class="page-thumbnails"></div></dialog>
<dialog id="zoom-dialog" class="zoom-dialog" aria-labelledby="zoom-title"><header class="zoom-header"><h2 id="zoom-title"></h2><div class="zoom-tools"><button id="zoom-out" class="icon-button drawn-control" type="button" aria-label="{{zoom_out}}"><svg class="button-frame" viewBox="0 0 120 64" preserveAspectRatio="none" aria-hidden="true"><use href="#i-control"/></svg><svg aria-hidden="true"><use href="#i-minus"/></svg></button><span id="zoom-level" class="sr-only" aria-live="polite"></span><button id="zoom-in" class="icon-button drawn-control" type="button" aria-label="{{zoom_in}}"><svg class="button-frame" viewBox="0 0 120 64" preserveAspectRatio="none" aria-hidden="true"><use href="#i-control"/></svg><svg aria-hidden="true"><use href="#i-plus"/></svg></button><a id="open-original" class="open-original" href="{{home}}" target="_blank" rel="noopener">{{open_image}}</a><button class="icon-button drawn-control" type="button" data-close="zoom-dialog" aria-label="{{close_zoom}}"><svg class="button-frame" viewBox="0 0 120 64" preserveAspectRatio="none" aria-hidden="true"><use href="#i-control"/></svg><svg aria-hidden="true"><use href="#i-close"/></svg></button></div></header><p id="zoom-status" class="zoom-status" role="status"></p><div id="zoom-frame" class="zoom-frame"><img id="zoom-image" alt="" draggable="false"></div></dialog>
<dialog id="share-dialog" class="share-dialog" aria-labelledby="share-title"><header class="dialog-header"><h2 id="share-title">{{share_title}}</h2><button class="icon-button drawn-control" type="button" data-close="share-dialog" aria-label="{{close_share}}"><svg class="button-frame" viewBox="0 0 120 64" preserveAspectRatio="none" aria-hidden="true"><use href="#i-control"/></svg><svg aria-hidden="true"><use href="#i-close"/></svg></button></header><p>{{share_copy}}</p><input id="share-url" type="url" readonly aria-label="{{share_url}}"></dialog>
<noscript><p class="no-script">{{no_script}}</p></noscript>
<script id="reader-copy" type="application/json">{{reader_copy}}</script></body></html>
